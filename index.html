<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis XV Años · Kamila Arianna</title>

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Mis XV Años · Kamila Arianna 🌸" />
  <meta property="og:description" content="Sábado 23 de Mayo 2026 · Jardín San Miguel, Atitalaquia, Hidalgo. ¡Estás invitado!" />
  <meta property="og:image"       content="https://invitacion-kamila-xv.netlify.app/photos/cover.jpg" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url"         content="https://invitacion-kamila-xv.netlify.app" />
  <meta name="twitter:card"       content="summary_large_image" />
  <meta name="twitter:title"      content="Mis XV Años · Kamila Arianna 🌸" />
  <meta name="twitter:description" content="Sábado 23 de Mayo 2026 · Jardín San Miguel, Atitalaquia, Hidalgo." />
  <meta name="twitter:image"      content="https://invitacion-kamila-xv.netlify.app/photos/cover.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Lato:wght@300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100vh;
      overflow: hidden;
    }

    /* ── HERO FULL ── */
    .hero {
      width: 100%; height: 100vh;
      position: relative;
      background: url('photos/cover.jpg') center 25% / cover no-repeat;
      background-color: #3d1a2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(61,26,43,.55) 0%,
        rgba(61,26,43,.25) 50%,
        rgba(61,26,43,.65) 100%
      );
    }

    /* Pétalos decorativos */
    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: .6; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ── CONTENIDO ── */
    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      padding: 0 24px;
    }

    .hero-pre {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 7px;
      font-size: .7rem;
      color: #e8d5b0;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp .9s .3s forwards;
    }

    .hero-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(4rem, 15vw, 8rem);
      color: #fff;
      text-shadow: 0 2px 30px rgba(0,0,0,.35);
      line-height: 1.05;
      opacity: 0;
      animation: fadeUp .9s .6s forwards;
    }

    .hero-xv {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(.85rem, 2.5vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 9px;
      color: #e8d5b0;
      text-transform: uppercase;
      margin-top: 10px;
      opacity: 0;
      animation: fadeUp .9s .9s forwards;
    }

    .hero-date {
      margin-top: 28px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: #e8d5b0;
      opacity: 0;
      animation: fadeUp .9s 1.1s forwards;
    }

    /* Línea dorada */
    .gold-line {
      width: 100px; height: 1px;
      background: linear-gradient(90deg, transparent, #C9A96E, transparent);
      margin: 22px auto 0;
      opacity: 0;
      animation: fadeUp .9s 1.3s forwards;
    }

    /* ── BOTÓN CLICK AQUÍ ── */
    .cta-circle {
      position: absolute;
      z-index: 10;
      bottom: 40px;
      right: 40px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 2px solid #C9A96E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      gap: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3), 0 0 0 6px rgba(201,169,110,.12);
      transition: transform .25s, box-shadow .25s;
      opacity: 0;
      animation: fadeUp .9s 1.8s forwards;
    }
    .cta-circle:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 8px rgba(201,169,110,.2);
    }
    .cta-arrow {
      font-size: 1.4rem;
      line-height: 1;
    }
    .cta-text {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 1px;
      font-size: .55rem;
      text-transform: uppercase;
      color: #e8d5b0;
      text-align: center;
    }

    /* Scroll hint */
    .scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeUp .9s 2.2s forwards;
    }
    .scroll-hint span {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 3px;
      font-size: .6rem;
      color: rgba(255,255,255,.6);
      text-transform: uppercase;
    }
    .scroll-line {
      width: 1px; height: 36px;
      background: linear-gradient(180deg, rgba(255,255,255,.6), transparent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── PRINT / PDF ── */
    @media print {
      html, body { height: 100%; overflow: visible; }
      .hero { height: 100vh; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-overlay"></div>

  <!-- Pétalos -->
  <div id="particles"></div>

  <!-- Contenido central -->
  <div class="hero-content">
    <p class="hero-pre">Una noche mágica · 23 de Mayo 2026</p>
    <h1 class="hero-name">Kamila Arianna</h1>
    <p class="hero-xv">Mis Quince Años</p>
    <p class="hero-date">Sábado · 23 · Mayo · 2026</p>
    <div class="gold-line"></div>
  </div>

  <!-- Botón Click Aquí -->
  <a class="cta-circle" href="invitacion.html">
    <span class="cta-arrow">✨</span>
    <span class="cta-text">Click<br>Aquí</span>
  </a>

  <!-- Scroll hint -->
  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span>Ver invitación</span>
  </div>
</div>

<script>
  const colors = ['#FFF0F5','#FFE0EA','#FFD0DF','#FFC0D4','#FFB0C9'];
  const container = document.getElementById('particles');
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'petal';
    el.style.cssText = `
      left: ${Math.random() * 100}%;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      width: ${4 + Math.random() * 7}px;
      height: ${4 + Math.random() * 7}px;
      animation-duration: ${7 + Math.random() * 12}s;
      animation-delay: ${Math.random() * 10}s;
    `;
    container.appendChild(el);
  }
</script>

</body>
</html>
